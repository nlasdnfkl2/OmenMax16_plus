<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <style>
        :root {
            --bg-canvas: #f6f7fb;
            --text-main: #1e2433;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-bg-hover: rgba(255, 255, 255, 0.98);
            --card-border: #e5e9f2;
            --card-border-hover: #c7d2fe;
            --card-shadow: 0 4px 16px rgba(148, 163, 184, 0.12);
            --card-shadow-hover: 0 8px 22px rgba(124, 58, 237, 0.1);
            --spotlight: rgba(167, 139, 250, 0.16);
            --btn-bg: rgba(246, 247, 251, 0.88);
            --btn-bg-hover: rgba(238, 242, 255, 0.98);
            --btn-border: #e4e8f1;
            --btn-text: #4b5563;
            --btn-active-bg: #ede9fe;
            --btn-active-border: #c4b5fd;
            --btn-active-text: #5b21b6;
            --popover-bg: rgba(252, 253, 255, 0.96);
            --popover-border: #dfe4ef;
            --thumb-color: #8b5cf6;
            --thumb-ring: rgba(196, 181, 253, 0.5);
            --rgb-bar: linear-gradient(90deg, #93c5fd 0%, #99f6e4 50%, #d8b4fe 100%);
        }

        html[data-theme="dark"] {
            --bg-canvas: #12141c;
            --text-main: #e5e7eb;
            --card-bg: #191c27;
            --card-bg-hover: #1f2331;
            --card-border: #282d3f;
            --card-border-hover: #474269;
            --card-shadow: none;
            --card-shadow-hover: none;
            --spotlight: rgba(167, 139, 250, 0.08);
            --btn-bg: #151822;
            --btn-bg-hover: #222636;
            --btn-border: #2a2f42;
            --btn-text: #cbd5e1;
            --btn-active-bg: #292440;
            --btn-active-border: #5b4b8a;
            --btn-active-text: #ddd6fe;
            --popover-bg: #181b26;
            --popover-border: #2c3145;
            --thumb-color: #9f85e8;
            --thumb-ring: rgba(159, 133, 232, 0.22);
            --rgb-bar: linear-gradient(90deg, #5b8fb9 0%, #569e8a 50%, #8c6bb1 100%);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .drag-region { -webkit-app-region: drag; }
        .no-drag { -webkit-app-region: no-drag; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: var(--thumb-color);
            cursor: pointer;
            box-shadow: 0 0 0 3px var(--thumb-ring);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        @keyframes blobA { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(5%,6%) scale(1.1); } }
        @keyframes blobB { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-6%,-5%) scale(1.12); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        @keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
        @keyframes fanspin { to { transform: rotate(360deg); } }
        @keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
        @keyframes statusBlink { 0%,100% { opacity: .45; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.22); } }
        @keyframes alertRing { 0%,100% { box-shadow: inset 0 0 0 1px transparent; } 50% { box-shadow: inset 0 0 0 1px var(--alert); } }
        @keyframes chargePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } 50% { box-shadow: 0 0 0 3px rgba(52,211,153,.2); } }
        @keyframes titleShine { 0%,100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
        @keyframes dashFlow { to { stroke-dashoffset: -12; } }

        .blob-a { animation: blobA 18s ease-in-out infinite; }
        .blob-b { animation: blobB 22s ease-in-out infinite; }
        .enter { opacity: 0; animation: fadeUp .5s cubic-bezier(.2,.8,.2,1) forwards; }
        .pop-in { animation: popIn .2s cubic-bezier(.2,.9,.3,1.15) both; }
        .fan-spin { animation: fanspin 1s linear infinite; }
        .bar-shimmer {
            background-image: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.45) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 2.4s linear infinite;
        }
        html[data-theme="dark"] .bar-shimmer {
            background-image: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.12) 50%, rgba(255,255,255,0) 100%);
        }
        .charge-pulse { animation: chargePulse 2.2s ease-in-out infinite; }
        .title-shine { background-size: 200% 100%; animation: titleShine 9s ease-in-out infinite; }
        .rgb-bar { background: var(--rgb-bar); transition: background 0.3s ease; }

        .interactive-card {
            --mx: 50%;
            --my: 50%;
            background-color: var(--card-bg);
            border-color: var(--card-border);
            box-shadow: var(--card-shadow);
            opacity: 0.96;
            transition: background-color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease, opacity 0.22s ease, transform 0.22s cubic-bezier(.2,.8,.2,1);
        }
        html:not([data-theme="dark"]) .interactive-card {
            backdrop-filter: blur(20px);
        }
        .interactive-card:hover {
            background-color: var(--card-bg-hover);
            border-color: var(--card-border-hover);
            box-shadow: var(--card-shadow-hover);
            opacity: 1;
            transform: translateY(-1px);
        }
        .card-spotlight {
            background: radial-gradient(220px circle at var(--mx) var(--my), var(--spotlight), transparent 72%);
            opacity: 0;
            transition: opacity 0.22s ease;
            pointer-events: none;
        }
        .interactive-card:hover .card-spotlight {
            opacity: 1;
        }

        .interactive-btn {
            background-color: var(--btn-bg);
            border-color: var(--btn-border);
            color: var(--btn-text);
            opacity: 0.93;
            transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, opacity 0.18s ease, transform 0.16s cubic-bezier(.2,.9,.3,1.15);
        }
        .interactive-btn:hover:not(:disabled) {
            background-color: var(--btn-bg-hover);
            border-color: var(--card-border-hover);
            opacity: 1;
            transform: translateY(-1px) scale(1.01);
        }
        .interactive-btn:active:not(:disabled) {
            transform: scale(0.97);
            opacity: 0.88;
        }
        .interactive-btn.is-active:not(:disabled) {
            background-color: var(--btn-active-bg);
            border-color: var(--btn-active-border);
            color: var(--btn-active-text);
            opacity: 1;
        }

        .top-icon-btn {
            background-color: var(--btn-bg);
            border-color: var(--btn-border);
            color: var(--btn-text);
            opacity: 0.9;
            transition: all 0.2s cubic-bezier(.2,.9,.3,1.15);
        }
        .top-icon-btn:hover {
            background-color: var(--btn-active-bg);
            border-color: var(--btn-active-border);
            color: var(--btn-active-text);
            opacity: 1;
            transform: translateY(-1px) scale(1.08);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
        }
    </style>
</head>

    <div id="boot-error" style="display:none;position:fixed;inset:0;z-index:99999;background:#fff1f2;color:#be123c;font:12px Consolas,monospace;padding:16px;white-space:pre-wrap;overflow:auto;-webkit-app-region:no-drag;user-select:text"></div>
    <script>
    (function () {
      function show(t) {
        var b = document.getElementById('boot-error');
        if (!b) return;
        b.style.display = 'block';
        b.textContent += t + '\n\n';
      }
      window.__showBootError = show;
      window.addEventListener('error', function (e) {
        var msg = e.message;
        if (!msg) {
          if (e.target) {
            msg = e.target.src ? e.target.src : e.target.href;
          }
        }
        if (!msg) msg = '알 수 없음';
        var loc = e.filename ? (' @' + e.filename + ':' + e.lineno + ':' + e.colno) : '';
        show('[error] ' + msg + loc);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        var detail = r ? (r.stack ? r.stack : r) : '';
        show('[promise] ' + detail);
      });
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (typeof React === 'undefined') show('React 로드 실패 (네트워크/CDN 확인)');
          if (typeof ReactDOM === 'undefined') show('ReactDOM 로드 실패 (네트워크/CDN 확인)');
          if (typeof tailwind === 'undefined') show('Tailwind 로드 실패 (네트워크/CDN 확인)');
          var r = document.getElementById('root');
          if (r) {
            if (!r.hasChildNodes()) show('앱이 렌더링되지 않았습니다 (위 오류 확인)');
          }
        }, 4000);
      });
    })();
    </script>

                        e('span', { key: 'l', className: 'text-[9.5px] font-semibold' }, l),
                        e('span', { key: 'w', className: 'text-[7.5px] ' + mutedText + ' mt-0.5' }, v ? ('≈' + Math.round(estWatts(v)) + 'W') : ('≈' + fullGpuMaxW + 'W'))
                      ]);
                    })),
                    e('div', { key: 'sl', className: 'flex items-center gap-2' }, [
                      e('input', {
                        key: 'i', type: 'range', min: 1200, max: 2800, step: 50,
                        value: gpuModal.cap ? gpuModal.cap : 2800,
                        onChange: function (ev) {
                          var v = parseInt(ev.target.value, 10);
                          setGpuModal(Object.assign({}, gpuModal, { cap: (v >= 2800) ? 0 : v }));
                        },
                        className: 'flex-1 cursor-pointer'
                      }),
                      e('span', { key: 'v', className: 'text-[10.5px] font-mono font-bold w-16 text-right ' + (isDark ? 'text-violet-300' : 'text-violet-700') }, gpuModal.cap ? (gpuModal.cap + 'MHz') : '무제한')
                    ]),
                    e('div', { key: 'ft', className: 'flex gap-2 justify-between' }, [
                      e('button', {
                        key: 'off', type: 'button',
                        onClick: function () { sendCmd('SET_GPU_MODE', -1); setGpuModal(Object.assign({}, gpuModal, { open: false })); },
                        className: 'no-drag px-2 py-1 rounded-lg text-[9.5px] font-medium transition-all duration-150 hover:-translate-y-0.5 active:scale-95 border cursor-pointer ' + (isDark ? 'bg-[#2b1b22] text-rose-200 border-[#4d2c3a] hover:bg-[#36222b]' : 'bg-rose-100/90 text-rose-700 border-rose-300 hover:bg-rose-200/80')
                      }, '끄기'),
                      e('div', { key: 'rb', className: 'flex gap-1.5' }, [
                        e('button', {
                          key: 'c', type: 'button',
                          onClick: function () { setGpuModal(Object.assign({}, gpuModal, { open: false })); },
                          className: 'no-drag interactive-btn px-2 py-1 rounded-lg border text-[9.5px] cursor-pointer'
                        }, '취소'),
                        e('button', {
                          key: 's', type: 'button',
                          onClick: function () { sendCmd('SET_GPU_CLOCK_CAP', gpuModal.cap); setGpuModal(Object.assign({}, gpuModal, { open: false })); },
                          className: 'no-drag px-2 py-1 rounded-lg text-[9.5px] font-semibold transition-all duration-150 hover:-translate-y-0.5 active:scale-95 border cursor-pointer ' + (isDark ? 'bg-[#282340] text-violet-200 border-[#584987] hover:bg-[#312b4f]' : 'bg-violet-100 text-violet-800 border-violet-300 hover:bg-violet-200/80')
                        }, '적용')
                      ])
                    ])
                  ]) : null
                ])
              ])
            ])
          ]),

          e('div', { key: 'bar2', className: 'h-[2px] w-full rounded-full shrink-0 rgb-bar relative z-10' })
        ]);
      }

      var root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(e(ErrorBoundary, null, e(App)));

      document.addEventListener('mousedown', function (ev) {
        if (ev.button !== 0) return;
        if (ev.target.closest('.no-drag, input, button, #curve-modal')) return;
        if (ev.target.closest('.drag-region')) {
          if (window.chrome) {
            if (window.chrome.webview) {
              window.chrome.webview.postMessage({ cmd: 'DRAG_WINDOW' });
            }
          }
        }
      });
    })();
    </script>
    <style>
      @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
      .guide-flow{animation:dashFlow 1.2s linear infinite}
      #curve-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(15,23,42,.42);font-family:"Segoe UI",sans-serif;color:var(--text-main)}
      html:not([data-theme="dark"]) #curve-modal{backdrop-filter:blur(4px)}
      #curve-modal.open{display:flex;animation:modalFade .2s ease both}
      #curve-modal.open #curve-dialog{animation:popIn .25s cubic-bezier(.2,.9,.3,1.15) both}
      #curve-modal *{box-sizing:border-box}
      #curve-dialog{display:flex;flex-direction:column;width:min(630px,100%);height:min(500px,100%);min-height:0;padding:17px;background:var(--popover-bg);border:1px solid var(--popover-border);border-radius:17px;box-shadow:0 18px 48px rgba(15,23,42,.22);transition:border-color .25s,background-color .25s}
      .curve-top,.curve-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}.curve-top{margin-bottom:8px;font-size:14px;font-weight:700;letter-spacing:.1em}
      #curve-modal button{border:1px solid var(--btn-border);border-radius:8px;background:var(--btn-bg);color:var(--btn-text);padding:8px 13px;font:600 12px "Segoe UI",sans-serif;cursor:pointer;transition:all .16s ease}
      #curve-modal button:hover{background:var(--btn-bg-hover);border-color:var(--card-border-hover);transform:translateY(-1px)}#curve-modal button:active{transform:scale(.97)}#curve-modal button.primary{background:var(--btn-active-bg);border-color:var(--btn-active-border);color:var(--btn-active-text)}
      .curve-tabs{display:flex;gap:6px;margin-bottom:10px;flex:none}
      .curve-tab{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--btn-text);font-size:11px;font-weight:700;letter-spacing:.08em;text-align:center;cursor:pointer;transition:all .18s}
      .curve-tab:hover{background:var(--btn-bg-hover);transform:translateY(-1px)}
      .curve-tab.active-cpu{background:rgba(56,189,248,.16);border-color:rgba(56,189,248,.5);color:#0284c7}
      html[data-theme="dark"] .curve-tab.active-cpu{background:#1b2938;border-color:#3e6385;color:#7dd3fc}
      .curve-tab.active-gpu{background:rgba(167,139,250,.18);border-color:rgba(167,139,250,.5);color:#6d28d9}
      html[data-theme="dark"] .curve-tab.active-gpu{background:#282340;border-color:#594b87;color:#ddd6fe}
      #curve-main{display:flex;flex:1;min-height:0;gap:7px}.curve-y{display:flex;flex-direction:column;justify-content:space-between;width:35px;padding-bottom:20px;text-align:right;color:var(--btn-text);opacity:.75;font:11px Consolas,monospace}
      .curve-plot{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0}
      #curve-svg{width:100%;flex:1;min-height:0;touch-action:none;border-radius:9px;border:1px solid var(--popover-border);background-color:var(--card-bg);background-image:linear-gradient(to right,var(--btn-border) 1px,transparent 1px),linear-gradient(to bottom,var(--btn-border) 1px,transparent 1px);background-size:20% 20%;cursor:crosshair}
      .curve-x{height:20px;display:flex;justify-content:space-between;padding-top:5px;color:var(--btn-text);opacity:.75;font:11px Consolas,monospace}
      .curve-bottom{margin-top:12px}.curve-help{font-size:11px;color:var(--btn-text);opacity:.75}.curve-error{color:#e11d48;font-size:11px;min-height:15px;margin-top:6px}
    </style>
    <div id="curve-modal" class="no-drag" role="dialog" aria-modal="true" aria-label="팬 커브 편집기">
      <div id="curve-dialog" class="no-drag">
        <div class="curve-top"><span id="curve-title">COOL 팬 커브 설정</span><button id="curve-close" type="button">✕</button></div>
        <div class="curve-tabs">
          <div id="curve-tab-cpu" class="curve-tab active-cpu">CPU 팬 커브</div>
          <div id="curve-tab-gpu" class="curve-tab">GPU 팬 커브</div>
        </div>
        <div id="curve-main"><div id="curve-y" class="curve-y"><span>100%</span><span>50%</span><span>0%</span></div>
          <div class="curve-plot"><svg id="curve-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg><div class="curve-x"><span>35°C</span><span>70°C</span><span>100°C</span></div></div>
        </div>
        <div id="curve-error" class="curve-error"></div>
        <div class="curve-bottom"><span id="curve-help" class="curve-help">클릭: 추가 · 드래그: 이동 · 우클릭: 삭제 · 탭 전환 시 각 데이터는 유지되며, 저장은 CPU/GPU 를 함께 저장합니다.</span><div><button id="curve-cancel" type="button">취소</button> <button id="curve-save" class="primary" type="button">저장하고 적용</button></div></div>
      </div>
    </div>
    <script>
    (function(){
      'use strict';
      var modal=document.getElementById('curve-modal'),svg=document.getElementById('curve-svg'),error=document.getElementById('curve-error');
      var dialog=document.getElementById('curve-dialog'),titleEl=document.getElementById('curve-title'),helpEl=document.getElementById('curve-help');
      var tabCpu=document.getElementById('curve-tab-cpu'),tabGpu=document.getElementById('curve-tab-gpu');
      var NS='http://www.w3.org/2000/svg';
      var PADDING=8,DOT_RADIUS=4.5;

      var curves={cpu:[],gpu:[]};
      var activeFan='cpu';
      var kind='cool';
      var drag=-1,saving=false;

      function yMax(){return 100;}
      function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
      function points(){return curves[activeFan];}
      function setPoints(p){curves[activeFan]=p;}

      function pointPixels(p,r){
        return {x:PADDING+(p.TemperatureCelsius-35)/65*(r.width-PADDING*2),y:PADDING+(yMax()-p.FanPercent)/yMax()*(r.height-PADDING*2)};
      }
      function coordinates(ev){
        var r=svg.getBoundingClientRect();
        var x=clamp((ev.clientX-r.left-PADDING)/(r.width-PADDING*2),0,1);
        var y=clamp((ev.clientY-r.top-PADDING)/(r.height-PADDING*2),0,1);
        return {TemperatureCelsius:Math.round(35+65*x),FanPercent:Math.round(yMax()*(1-y))};
      }
      function hit(ev){
        var r=svg.getBoundingClientRect();
        return points().findIndex(function(p){
          var pixel=pointPixels(p,r);
          return Math.hypot(ev.clientX-r.left-pixel.x,ev.clientY-r.top-pixel.y)<=10;
        });
      }
      function updateTabStyle(){
        tabCpu.classList.toggle('active-cpu',activeFan==='cpu');
        tabGpu.classList.toggle('active-gpu',activeFan==='gpu');
      }
      function applyKindTheme(){
        var dark=document.documentElement.getAttribute('data-theme')==='dark';
        var quiet=kind==='quiet';
        titleEl.textContent=quiet?'QUIET 팬 커브 설정':'COOL 팬 커브 설정';
        titleEl.style.color=quiet?(dark?'#6ee7b7':'#047857'):(dark?'#7dd3fc':'#0369a1');
        dialog.style.borderColor=quiet?(dark?'#3d6b5d':'#6ee7b7'):(dark?'#3e6385':'#7dd3fc');
        dialog.style.boxShadow=dark?'0 18px 48px rgba(0,0,0,.45)':'0 18px 48px rgba(15,23,42,.2)';
        helpEl.textContent=quiet
          ?'QUIET: CPU/GPU 개별 온도 계산 후 높은 쪽 목표치로 양쪽 팬이 동일 속도로 동기화됩니다.'
          :'COOL: CPU/GPU 개별 온도 계산 후 높은 쪽 목표치로 양쪽 팬이 동일 속도로 동기화됩니다.';
        var labels=document.querySelectorAll('#curve-y span');
        labels[0].textContent=yMax()+'%';
        labels[1].textContent=(yMax()/2)+'%';
        labels[2].textContent='0%';
      }
      function draw(){
        var r=svg.getBoundingClientRect();
        if(r.width<=PADDING*2)return;
        if(r.height<=PADDING*2)return;
        var lineColor=(activeFan==='cpu')?'#38bdf8':'#a78bfa';
        var dotStroke=(activeFan==='cpu')?'#0284c7':'#7c3aed';
        function position(p){var v=pointPixels(p,r);return {x:v.x/r.width*100,y:v.y/r.height*100};}
        svg.replaceChildren();

        {
          var g=position({TemperatureCelsius:35,FanPercent:40});
          var guide=document.createElementNS(NS,'line');
          guide.setAttribute('x1','0');guide.setAttribute('x2','100');guide.setAttribute('y1',g.y);guide.setAttribute('y2',g.y);
          guide.setAttribute('stroke','#f59e0b88');guide.setAttribute('stroke-width','1');guide.setAttribute('stroke-dasharray','3 3');guide.setAttribute('vector-effect','non-scaling-stroke');
          guide.setAttribute('class','guide-flow');
          svg.appendChild(guide);
        }

        var pts=points();
        if(pts.length>=2){
          var first=position(pts[0]),last=position(pts[pts.length-1]);
          var area=document.createElementNS(NS,'polygon');
          area.setAttribute('points',[first.x+',100'].concat(pts.map(function(p){var v=position(p);return v.x+','+v.y;})).concat([last.x+',100']).join(' '));
          area.setAttribute('fill',lineColor+'2e');
          svg.appendChild(area);
        }

        var line=document.createElementNS(NS,'polyline');
        line.setAttribute('points',pts.map(function(p){var v=position(p);return v.x+','+v.y;}).join(' '));
        line.setAttribute('fill','none');line.setAttribute('stroke',lineColor);line.setAttribute('stroke-width','2');line.setAttribute('vector-effect','non-scaling-stroke');svg.appendChild(line);
        for(var k=0;k<pts.length;k++){
          var p=pts[k];
          var v=position(p),dot=document.createElementNS(NS,'ellipse');
          dot.setAttribute('cx',v.x);dot.setAttribute('cy',v.y);
          dot.setAttribute('rx',DOT_RADIUS/r.width*100);dot.setAttribute('ry',DOT_RADIUS/r.height*100);
          dot.setAttribute('fill','#ffffff');dot.setAttribute('stroke',dotStroke);dot.setAttribute('stroke-width','1.8');dot.setAttribute('vector-effect','non-scaling-stroke');svg.appendChild(dot);
        }
      }
      function switchTab(fan){
        if(saving)return;
        if(fan===activeFan)return;
        activeFan=fan;drag=-1;
        updateTabStyle();draw();
      }
      tabCpu.addEventListener('click',function(){switchTab('cpu');});
      tabGpu.addEventListener('click',function(){switchTab('gpu');});
      new ResizeObserver(function(){if(modal.classList.contains('open'))draw();}).observe(svg);
      svg.addEventListener('pointerdown',function(ev){
        if(ev.button!==0)return;
        if(saving)return;
        var index=hit(ev);
        if(index>=0)drag=index;
        else {
          var p=coordinates(ev);
          var cur=points();
          if(cur.length>=20)return;
          if(cur.some(function(x){return Math.abs(x.TemperatureCelsius-p.TemperatureCelsius)<3;}))return;
          var next=cur.concat([p]).sort(function(a,b){return a.TemperatureCelsius-b.TemperatureCelsius;});
          setPoints(next);
          drag=next.indexOf(p);
          draw();
        }
        svg.setPointerCapture(ev.pointerId);ev.preventDefault();
      });
      svg.addEventListener('pointermove',function(ev){
        if(drag<0)return;
        if(saving)return;
        var cur=points();
        var p=coordinates(ev),min=(drag===0)?35:(cur[drag-1].TemperatureCelsius+3),max=(drag===cur.length-1)?100:(cur[drag+1].TemperatureCelsius-3);
        cur[drag]={TemperatureCelsius:clamp(p.TemperatureCelsius,min,max),FanPercent:p.FanPercent};
        draw();
      });
      svg.addEventListener('pointerup',function(){drag=-1;});
      svg.addEventListener('pointercancel',function(){drag=-1;});
      svg.addEventListener('contextmenu',function(ev){
        ev.preventDefault();
        var i=hit(ev);
        if(i>=0){
          if(points().length>2){
            if(!saving){
              setPoints(points().filter(function(_,j){return i!==j;}));
              draw();
            }
          }
        }
      });
      function close(){if(!saving){modal.classList.remove('open');error.textContent='';drag=-1;}}
      document.getElementById('curve-close').addEventListener('click',close);
      document.getElementById('curve-cancel').addEventListener('click',close);
      document.getElementById('curve-save').addEventListener('click',function(){
        if(saving)return;
        if(curves.cpu.length<2)return;
        if(curves.gpu.length<2)return;
        saving=true;error.textContent='저장 중...';
        window.chrome.webview.postMessage({cmd:(kind==='quiet')?'SAVE_QUIET_CURVE':'SAVE_CUSTOM_CURVE',points:{cpu:curves.cpu,gpu:curves.gpu}});
      });
      document.addEventListener('keydown',function(ev){
        if(ev.key==='Escape'){
          if(modal.classList.contains('open')){ev.stopPropagation();close();}
          else { window.dispatchEvent(new CustomEvent('omen-close-cpu-modal')); }
        }
      },true);
      window.chrome.webview.addEventListener('message',function(ev){
        var m=ev.data;
        if(m){
          if(m.cmd==='OPEN_CURVE'){
            kind=(m.kind==='quiet')?'quiet':'cool';
            function toArr(arr){
              return Array.isArray(arr)?arr.map(function(p){return {TemperatureCelsius:Number(p.TemperatureCelsius),FanPercent:Math.min(Number(p.FanPercent),yMax())};}).sort(function(a,b){return a.TemperatureCelsius-b.TemperatureCelsius;}):[];
            }
            curves.cpu=toArr(m.points ? m.points.cpu : null);
            curves.gpu=toArr(m.points ? m.points.gpu : null);
            activeFan='cpu';
            saving=false;error.textContent='';
            applyKindTheme();
            updateTabStyle();
            modal.classList.add('open');draw();
          }else if(m.cmd==='CURVE_SAVE_RESULT'){
            saving=false;
            if(m.ok)close();else error.textContent=m.error ? m.error : '저장 실패';
          }
        }
      });
    })();
    </script>
</body>
</html>
